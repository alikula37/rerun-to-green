name: analyze

on:
  push:
    branches: [main]
    paths:
      - "data/raw/**"
      - "data/processed/**"
      - "src/**"
      - ".github/workflows/analyze.yml"
  pull_request:
    paths:
      - "data/raw/**"
      - "data/processed/**"
      - "src/**"
      - ".github/workflows/analyze.yml"
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate results from raw data and compare
        run: python3 src/check_fresh.py

      - name: Validate attempt-level recovery (skips if GH_TOKEN unset)
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 src/validate_attempts.py
